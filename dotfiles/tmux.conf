set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",tmux-256color:Tc"

# Extended (modified) keys: lets apps like the pi/Claude Code agent receive
# Shift/Ctrl+Enter etc. The terminal-features line tells tmux the outer
# terminal (Ghostty) understands extended keys so it forwards them through.
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -g repeat-time 1000
set -g mode-keys vi
set -g focus-events on

## name windows per directory basename
###########################################
# Drive the real window name (#W) from the cwd basename instead of the
# running command, and keep it updating as the pane changes directory.
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g window-status-format ' #I  #W '
set -g window-status-current-format ' #I  #W '

## status bar
##########################################
# Two-row status bar: the standard bar (status-left | centred window list |
# status-right) renders on the top row (status-format[1]); row 0 is left blank
# as a spacer below it. Per-window styles come from #{E:window-status-style}
# and #{E:window-status-current-style}; the window format's own style is scoped
# with push-default/pop-default. This is a trimmed version of tmux's built-in
# status-format default (the unused last/bell/activity style branches removed).
#
# Built up in chunks with `set -ga` (append) so each part is readable and
# commentable; the chunks are concatenated into one format string. NOTE: the
# `#[norange default]` after each `#[pop-default]` is required to close that
# window's clickable mouse range. Without it the LAST window has no following
# `#[range=...]` to implicitly close it, so its name becomes unclickable.
set -g status 2

# 1. status-left, then open the centred, clickable window list
set -g  'status-format[1]' '#[align=left]#{T;=/#{status-left-length}:status-left}'
set -ga 'status-format[1]' '#[list=on align=#{status-justify}]'

# 2. window loop #{W:<inactive>,<active>}. Inactive-window branch:
set -ga 'status-format[1]' '#{W:#[range=window|#{window_index} #{E:window-status-style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},'

# 3. active-window branch (list=focus), then close the #{W:} loop with `}`
set -ga 'status-format[1]' '#[range=window|#{window_index} list=focus #{E:window-status-current-style}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}}}'

# 4. status-right, right-aligned and non-clickable
set -ga 'status-format[1]' '#[nolist align=right]#{T;=/#{status-right-length}:status-right}'
set -g 'status-format[0]' ''
set -g status-interval 60 # sets refresh of status bar

## set status bar colours
set -g status-style fg=brightwhite,bg=default

## show if activity in another window
set -g monitor-activity on
set -g visual-activity off

## set status bar items
set -g status-justify centre
set -g status-left-length 40
set -g status-left "#[fg=colour250] #S #[fg=colour244] #[fg=colour250]#I #[fg=colour244] #[fg=colour250]#P "
set -g status-right "#[fg=colour250]%R #[fg=colour244] #[fg=colour250]%d %b "

## set inactive windows
setw -g window-status-style fg=colour250,bg=default

## set active window red
setw -g window-status-current-style fg=colour203,bg=default,bold

# set pane divider colours
set -g pane-border-style fg=colour239,bg=default

set -g pane-active-border-style fg=colour203,bg=default

## set command line
set -g message-style fg=white,bg=black,bright
set -g display-time 2000

###########################################

# reduce key escape time
set -s escape-time 50

# increase scrollback buffer size
set-option -g history-limit 50000

# start window numbering from 1 not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# key bindings
bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Seamless C-h/j/k/l across nvim splits and tmux panes (smart-splits on the
# nvim side, plugins/ergonomics.lua). If the active pane runs (n)vim the key is
# forwarded so nvim moves its split; otherwise tmux switches pane. Process
# detection here is independent of the nvim plugin, so no tmux plugin needed.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
# In copy-mode, C-h/j/k/l move panes directly (no nvim to forward to).
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R

# clipboard: OSC52 — tmux emits the escape sequence, the terminal (Ghostty)
# sets the system clipboard. Works on macOS and Linux with no external binary
# (no pbcopy/xclip/wl-copy) and over SSH. Same config on every machine.
set -g set-clipboard on

# copy-mode-vi bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode-vi S-PPage send -X halfpage-up
bind -T copy-mode-vi S-NPage send -X halfpage-down

# setw is set-window-option shortened

# enable mouse scroll
set -g mouse on

# <--- start temporary sessionview config --->
# Remove everything down to the matching end marker to drop it.
# Right-click pane menu: default items PLUS "Speak → <agent>" at the top when
# the pane title carries an agent address ("✳ super.taskmaster+8206b273").
# Runs `tmux-send-agent <pane>` (~/bin) == `send <bare-address>` (subject
# "speak"). Mike, voice 2026-08-18. "Continue → <agent>" sits under it and
# sends subject "continue" — for nudging a stopped agent to resume (DF-53,
# Mike, voice 2026-08-21). Default menu copied from `tmux list-keys
# -T root MouseDown3Pane` (tmux 3.7b) — re-copy if tmux's default changes.
# 2026-08-23 (Pip, Mike by voice 19:19): titles from `session start` are
# "agent:cwd:sid" (pip:.pip:c436be54) and "home-foreman-cora:8b27939b" — no
# dot, so the two items vanished. Condition now accepts role.project OR
# name:rest; the label cuts at the first non-address char (a literal ":" in
# an s/// pattern breaks tmux's format parser, so the class is inverted).
# 2026-09-06 17:10 (Pip; Mike by voice on the walk, 17:07: "it seems to be only
# failing on the project boxes ... failing based on the name maybe"): project-
# mail seats title as "✳ catalog+super.0bb870c2" / "✳ catalog+cat-30.foreman.
# 795d6447" -- a "+" before the first dot, which [a-z_]+[.] refused, so those
# panes got the plain menu. The first segment now allows + digits -; the label
# class allows + too (it cut "catalog+super" to "catalog"). Measured on all 16
# panes: the three project seats now match, shells (title "m5") still do not.
# 2026-09-14 (Jim): copied in from Mike's config. Default items checked
# against tmux 3.7c — identical to the 3.7b copy.
bind-key -T root MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { select-pane -t = ; send-keys -M } { display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M \
  "#{?#{m/r:^[^ ]+ ([a-z_][a-z0-9_+-]*[.][^ ]+|[a-z][a-z0-9_-]*:[^ ]+)$,#{pane_title}},Speak → #{s/[^A-Za-z0-9_.+-].*//:#{s/^[^ ]+ //:pane_title}},}" S { run-shell -b "~/.local/bin/tmux-send-agent #{pane_id}" } \
  "#{?#{m/r:^[^ ]+ ([a-z_][a-z0-9_+-]*[.][^ ]+|[a-z][a-z0-9_-]*:[^ ]+)$,#{pane_title}},Continue → #{s/[^A-Za-z0-9_.+-].*//:#{s/^[^ ]+ //:pane_title}},}" C { run-shell -b "~/.local/bin/tmux-send-agent #{pane_id} continue" } \
  "#{?#{m/r:^[^ ]+ ([a-z_][a-z0-9_+-]*[.][^ ]+|[a-z][a-z0-9_-]*:[^ ]+)$,#{pane_title}},Park → #{s/[^A-Za-z0-9_.+-].*//:#{s/^[^ ]+ //:pane_title}},}" P { run-shell -b "~/.local/bin/tmux-send-agent #{pane_id} 'please settle your context, then park'" } \
  "#{?#{m/r:^[^ ]+ ([a-z_][a-z0-9_+-]*[.][^ ]+|[a-z][a-z0-9_-]*:[^ ]+)$,#{pane_title}},Stand Down → #{s/[^A-Za-z0-9_.+-].*//:#{s/^[^ ]+ //:pane_title}},}" D { run-shell -b "~/.local/bin/tmux-send-agent #{pane_id} -- 'please settle your context, then release the seat session mail arm --session-only'" } \
  "#{?#{m/r:^[^ ]+ ([a-z_][a-z0-9_+-]*[.][^ ]+|[a-z][a-z0-9_-]*:[^ ]+)$,#{pane_title}},Succeed → #{s/[^A-Za-z0-9_.+-].*//:#{s/^[^ ]+ //:pane_title}},}" U { run-shell -b "~/.local/bin/tmux-send-agent #{pane_id} -- 'please settle your context, then succeed: start your successor, hand over, and release the seat'" } \
  "#{?#{m/r:^[^ ]+ ([a-z_][a-z0-9_+-]*[.][^ ]+|[a-z][a-z0-9_-]*:[^ ]+)$,#{pane_title}},Read Clipboard → #{s/[^A-Za-z0-9_.+-].*//:#{s/^[^ ]+ //:pane_title}},}" B { run-shell -b "~/.local/bin/tmux-send-agent #{pane_id} -- 'please read the clipboard (pbpaste) and act on it'" } \
  "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } '' "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "#{?#{!:#{pane_floating_flag}},Horizontal Split,}" h { split-window -h } "#{?#{!:#{pane_floating_flag}},Vertical Split,}" v { split-window -v } '' "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Up,}" u { swap-pane -U } "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Down,}" d { swap-pane -D } "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } '' Kill X { kill-pane } Respawn R { respawn-pane -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } }
# <--- end temporary sessionview config --->

# pane synchronization toggle
bind S setw synchronize-panes

# kill pane/window bindings
bind x kill-pane
bind X kill-window

# aggressive resize for multi-client sessions
setw -g aggressive-resize on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# extrakto: prefix+Tab to fuzzy-grab paths/URLs/hashes/words off the screen
# and insert into the pane or copy. Use OSC52 for the clipboard so it stays
# dep-free and cross-OS, matching set-clipboard above (no pbcopy/xclip).
set -g @plugin 'laktak/extrakto'
set -g @extrakto_clip_tool_run "tmux_osc52"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
