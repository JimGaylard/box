---
- hosts: localhost
  tasks:
    - name: Setup Homebrew
      include_tasks: ../tasks/homebrew.yml
      tags: [homebrew, dotfiles]

    - name: Install Homebrew packages
      community.general.homebrew:
        name:
          - aria2
          - bash
          - bat
          - beads
          - cmake
          - coreutils
          - colima
          - docker
          - docker-buildx
          - docker-compose
          - ffmpeg
          - findutils
          - fswatch
          - fzf
          - gawk
          - gh
          - git
          - gnu-sed
          - gnu-tar
          - googleworkspace-cli
          - herdr
          - grep
          - htop
          - jq
          - lazygit
          - neomutt
          - neovim
          - openssh
          - opentofu
          - pass
          - pi-coding-agent
          - portaudio
          - prettierd
          - qrencode
          - starship
          - ripgrep
          - tmux
          - watch
          - ykman
          - zsh-autosuggestions
          - zsh-syntax-highlighting
        state: present
      tags: [packages]

    - name: Tap Homebrew repositories
      community.general.homebrew_tap:
        name: rp1-run/tap
        state: present
      tags: [packages, casks]

    - name: Install Homebrew casks
      community.general.homebrew_cask:
        name:
          - 1password-cli
          - antigravity-cli
          - claude-code@latest
          - codex
          - deltachat
          - font-meslo-lg-nerd-font
          - font-powerline-symbols
          - gcloud-cli
          - ghostty
          - hammerspoon
          - rp1
        state: present
      tags: [packages, casks]

    - name: Setup docker
      include_tasks: ../tasks/docker.yml
      tags: [docker, dotfiles]

    - name: Deploy dotfiles
      include_tasks: ../tasks/dotfiles.yml
      tags: [dotfiles]

    - name: Setup neovim
      include_tasks: ../tasks/neovim.yml
      tags: [neovim, dotfiles]

    - name: Setup tmux
      include_tasks: ../tasks/tmux.yml
      tags: [tmux, dotfiles]

    - name: Setup herdr
      include_tasks: ../tasks/herdr.yml
      tags: [herdr, dotfiles]

    - name: Setup golang
      include_tasks: ../tasks/golang.yml
      tags: [golang, dotfiles]

    - name: Setup nvm
      include_tasks: ../tasks/nvm.yml
      tags: [nvm, dotfiles]

    - name: Setup uv
      include_tasks: ../tasks/uv.yml
      tags: [uv, dotfiles]

    - name: Setup rust
      include_tasks: ../tasks/rust.yml
      tags: [rust, dotfiles]

    - name: Setup keycutter
      include_tasks: ../tasks/keycutter.yml
      tags: [keycutter]

    - name: Setup copyparty
      include_tasks: ../tasks/copyparty.yml
      tags: [copyparty]
